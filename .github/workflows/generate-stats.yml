name: generate-stats-card

on:
  # 每天自动刷新一次（错开 snake 的整点任务）
  schedule:
    - cron: "30 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: generate stats card svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: push stats card to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
