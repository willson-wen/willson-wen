name: fetch-profile-banner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  fetch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download banner when missing
        run: |
          if [ ! -f assets/banner-kasadin-lab.jpg ]; then
            mkdir -p assets
            curl -fsSL "https://aka.doubaocdn.com/s/PAgT2MG0vf" -o assets/banner-kasadin-lab.jpg
            file assets/banner-kasadin-lab.jpg
            du -h assets/banner-kasadin-lab.jpg
          else
            echo "banner already exists, skip download"
          fi

      - name: Commit banner back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-kasadin-lab.jpg
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: add profile banner [skip ci]"
            git push
          fi
