name: generate-profile-cards

on:
  # 每天自动刷新一次
  schedule:
    - cron: "0 */24 * * *"
  # 支持手动触发
  workflow_dispatch:
  # main 分支有推送时刷新
  push:
    branches:
      - main

jobs:
  cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      # 1) 贪吃蛇贡献图（明/暗两份）
      - name: generate contribution snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2) 统计卡片（自托管，避免公共实例不可达）
      - name: generate stats card svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3) 一次性把全部卡片推到 output 分支（全量，避免并发覆盖）
      - name: push all cards to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
